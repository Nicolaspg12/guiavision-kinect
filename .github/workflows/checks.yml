name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile source without importing hardware dependencies
        run: python3 -m compileall -q guiavision tests
      - name: Integrity and direction tests (no model deserialization)
        run: python3 -m unittest discover -s tests -v
