name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile source without importing hardware dependencies
        run: python3 -m compileall -q guiavision tests
      - name: Integrity and direction tests (no model deserialization)
        run: python3 -m unittest discover -s tests -v
